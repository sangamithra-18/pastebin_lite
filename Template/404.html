<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Page Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8f9fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 12px rgba(0,0,0,.15);
        }
        a {
            text-decoration: none;
            color: #0d6efd;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>404</h1>
        <p>This paste does not exist or has expired.</p>
        <a href="/">← Back to Home</a>
    </div>
</body>
</html>
