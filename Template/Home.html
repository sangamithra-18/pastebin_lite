   {% load static %}
   <!DOCTYPE html>
    <html>
    <head>
        <title>Pastebin Lite</title>
        <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
         <link rel="stylesheet" href="{% static 'css/home.css' %}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </head>
    <body>
        <div class="container-fluid">
            <div class="row">
                <div class="col-8   ">
                      <h2  class="mt-4"> Create Paste</h2>

    <form  id="pasteForm" method="POST" action="/api/pastes/">
        {% csrf_token %}

        <label>Text</label><br>
        <textarea name="content_paste" required></textarea><br><br>

    
        <label>Expiry</label><br>
        <select name="expiry" required>
            <option value="burn">Burn after read</option>
            <option value="1_hour">1 Hour</option>
            <option value="1_day">1 Day</option>
            <option value="1_week">1 Week</option>
            <option value="2_weeks">2 Weeks</option>
            <option value="1_month">1 Month</option>
            <option value="6_months">6 Months</option>
            <option value="1_year">1 Year</option>
            <option value="never" selected>Never</option>
        </select><br><br>

        <label>Category</label><br>
        <select name="category">
            <option value="text">Text</option>
            <option value="code">Code</option>
            <option value="notes">Notes</option>
            <option value="secret">Secret</option>
            <option value="food">Food</option>
            <option value="movies">Movies</option>
            <option value="other">Other</option>
        </select><br><br>

        <label>Max Views</label><br>
        <input type="number" name="max_views" min="1"><br><br>

        <button type="submit">Create</button>
    </form>
                </div>
               <div class="col-4">
    <h4 class="mt-5">Available Pastes</h4>

    <ul id="pasteList">
        {% for paste in pastes %}
            <li>
                <a href="/p/{{ paste.id }}/" target="_blank">
                    {{ paste.id }}
                </a>
                {% if paste.expires_at %}
                    (expires {{ paste.expires_at }})
                {% endif %}
            </li>
        {% empty %}
            <li>No active pastes</li>
        {% endfor %}
    </ul>
</div>

            </div>
        </div>

  


    
 

    </body>
<script>
document.addEventListener("DOMContentLoaded", function () {

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let cookie of cookies) {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }

    const form = document.getElementById("pasteForm");
    const pasteList = document.getElementById("pasteList");

    if (!form || !pasteList) {
        console.error("Required DOM elements missing");
        return;
    }

    form.addEventListener("submit", function (e) {
        e.preventDefault();

        const formData = new FormData(this);
        const csrfToken = getCookie('csrftoken');

        axios.post("/api/pastes/", formData, {
            headers: { 'X-CSRFToken': csrfToken }
        })
        .then(response => {
            const li = document.createElement("li");
            li.innerHTML = `<a href="${response.data.url}" target="_blank">
                                ${response.data.id}
                            </a>`;
            pasteList.prepend(li);
            this.reset();
        })
        .catch(err => {
            console.error(err.message);
        });
    });

});
</script>
</body>
</html>
